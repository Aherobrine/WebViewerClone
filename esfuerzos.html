<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diagramas de esfuerzos</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background-color: #f0f2f5; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 900px; }
        h2 { color: #1a73e8; text-align: center; margin-bottom: 5px; }
        p { text-align: center; color: #555; font-size: 0.95em; margin-bottom: 25px; }
        
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95em; transition: all 0.3s; background: #e8f0fe; color: #1a73e8; }
        button:hover { background: #d2e3fc; }
        button.active { background: #1a73e8; color: white; box-shadow: 0 4px 10px rgba(26, 115, 232, 0.3); }

        .canvas-container { position: relative; background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 15px 0; display: flex; justify-content: center;}
        canvas { display: block; max-width: 100%; }
        
        .stats { display: flex; justify-content: space-around; margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px dashed #ccc; }
        .stat-item { text-align: center; }
        .stat-label { font-size: 0.8em; color: #777; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-weight: bold; color: #333; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="container">
    <h2>Diagramas de esfuerzos internos</h2>
    <p>Viga L = 180 mm | F<sub>y</sub> = 1047,7 N (↓) | F<sub>x</sub> = 1500 N (→) | M<sub>z</sub> = 120 N·m (↻)</p>

    <div class="controls">
        <button id="btn-axil" onclick="setDiagram('axil')" class="active">Esfuerzo axil (N)</button>
        <button id="btn-shear" onclick="setDiagram('shear')">Esfuerzo cortante (V)</button>
        <button id="btn-moment" onclick="setDiagram('moment')">Momento flector (M)</button>
    </div>

    <div class="canvas-container">
        <canvas id="mainCanvas" width="850" height="520"></canvas>
    </div>

    <div class="stats">
        <div class="stat-item"><span class="stat-label">Longitud</span><span class="stat-value">180 mm</span></div>
        <div class="stat-item"><span class="stat-label">Material</span><span class="stat-value">Acero S355JR</span></div>
        <div class="stat-item"><span class="stat-label">Sección</span><span class="stat-value">Circular</span></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    
    let currentDiagram = 'axil';
    let progress = 0; 
    
    // Configuración geométrica
    const margin = 160; 
    const w = canvas.width - margin * 2; // Ancho de la viga (530px)
    const yBeam = 120;       // Altura a la que se dibuja la viga
    const yDiagBase = 400;   // Altura base de los diagramas

    function setDiagram(type) {
        currentDiagram = type;
        progress = 0; // Reiniciar animación suave
        document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + type).classList.add('active');
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Efecto Ease-out para la animación
        progress += (1 - progress) * 0.08;
        if (1 - progress < 0.005) progress = 1;

        // 1. DIBUJAR VIGA, CARGAS Y REACCIONES (SIEMPRE VISIBLES)
        drawStaticSystem();

        // 2. LÍNEAS GUÍA (De la viga al diagrama)
        ctx.strokeStyle = "rgba(0,0,0,0.1)";
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(margin, yBeam + 20); ctx.lineTo(margin, yDiagBase + 40);
        ctx.moveTo(margin + w, yBeam + 20); ctx.lineTo(margin + w, yDiagBase + 40);
        ctx.stroke();
        ctx.setLineDash([]);

        // 3. EJE BASE DEL DIAGRAMA
        ctx.strokeStyle = '#999';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(margin - 20, yDiagBase);
        ctx.lineTo(margin + w + 20, yDiagBase);
        ctx.stroke();

        // Título dinámico
        ctx.fillStyle = "#555";
        ctx.font = "bold 16px Segoe UI";
        let title = "";
        if (currentDiagram === 'axil') title = "Diagrama de esfuerzo axil (N)";
        if (currentDiagram === 'shear') title = "Diagrama de esfuerzo cortante (V)";
        if (currentDiagram === 'moment') title = "Diagrama de momento flector (M)";
        ctx.fillText(title, margin, yDiagBase - 150);

        // 4. DIBUJAR EL DIAGRAMA SELECCIONADO
        if (currentDiagram === 'axil') drawAxil(margin, yDiagBase, w);
        else if (currentDiagram === 'shear') drawShear(margin, yDiagBase, w);
        else if (currentDiagram === 'moment') drawMoment(margin, yDiagBase, w);

        requestAnimationFrame(draw);
    }

    function drawStaticSystem() {
        // Empotramiento (Pared izquierda)
        ctx.fillStyle = "#ccc";
        ctx.fillRect(margin - 20, yBeam - 40, 20, 80);
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(margin, yBeam - 45); ctx.lineTo(margin, yBeam + 45); ctx.stroke();
        
        // Viga
        ctx.fillStyle = "#dfe3e8";
        ctx.fillRect(margin, yBeam - 10, w, 20);
        
        // --- CARGAS APLICADAS (Lado Derecho) ---
        // Fx: 1500 N (Hacia la derecha)
        drawStraightArrow(margin + w, yBeam, margin + w + 50, yBeam, "#1a73e8", "Fx: 1500 N", margin + w + 60, yBeam + 4);
        // Fy: 1047.7 N (Hacia abajo)
        drawStraightArrow(margin + w, yBeam, margin + w, yBeam + 50, "#ea4335", "Fy: 1047,7 N", margin + w + 10, yBeam + 60);
        // Mz: 120 N·m (Sentido horario)
        drawCurvedArrow(margin + w, yBeam, 25, -Math.PI/2, Math.PI/2, false, "#34a853", "Mz: 120 N·m", margin + w + 30, yBeam - 30);

        // --- REACCIONES CALCULADAS (Lado Izquierdo) ---
        // Rx: 1500 N (Hacia la izquierda)
        drawStraightArrow(margin, yBeam, margin - 50, yBeam, "#1a73e8", "Rx: 1500 N", margin - 120, yBeam + 4);
        // Ry: 1047.7 N (Hacia arriba)
        drawStraightArrow(margin, yBeam, margin, yBeam - 50, "#ea4335", "Ry: 1047,7 N", margin - 85, yBeam - 55);
        // Mr: 308.6 N·m (Sentido anti-horario)
        drawCurvedArrow(margin, yBeam, 25, -Math.PI/2, Math.PI/2, true, "#34a853", "Mr: 308,6 N·m", margin - 100, yBeam - 30);
    }

    function drawAxil(x, y, w) {
        const height = 70 * progress;
        ctx.fillStyle = "rgba(26, 115, 232, 0.1)";
        ctx.fillRect(x, y - height, w, height); // Hacia arriba (+)
        ctx.strokeStyle = "#1a73e8";
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y - height, w, height);
        
        if (progress > 0.5) {
            ctx.fillStyle = "#1a73e8";
            ctx.font = "bold 15px Segoe UI";
            ctx.fillText("⬅ 1500 N ⮕", x + w/2 - 60, y - height - 15);
        }
    }

    function drawShear(x, y, w) {
        const height = 70 * progress;
        ctx.fillStyle = "rgba(234, 67, 53, 0.1)";
        ctx.fillRect(x, y - height, w, height); // Hacia arriba (+)
        ctx.strokeStyle = "#ea4335";
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y - height, w, height);
        
        if (progress > 0.5) {
            ctx.fillStyle = "#ea4335";
            ctx.font = "bold 15px Segoe UI";
            ctx.fillText("⬆ 1047,7 N ⬇", x + w/2 - 60, y - height - 15);
        }
    }

    function drawMoment(x, y, w) {
        const scale = 0.35; // Factor de escala visual
        const m1 = 308.58 * scale * progress; // Reacción en x=0
        const m2 = 120.0 * scale * progress;  // Carga en x=L

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y - m1);
        ctx.lineTo(x + w, y - m2);
        ctx.lineTo(x + w, y);
        ctx.closePath();
        
        ctx.fillStyle = "rgba(52, 168, 83, 0.1)";
        ctx.fill();
        ctx.strokeStyle = "#34a853";
        ctx.lineWidth = 2;
        ctx.stroke();

        if (progress > 0.5) {
            ctx.fillStyle = "#34a853";
            ctx.font = "bold 15px Segoe UI";
            ctx.fillText("↺ 308,6 N·m", x + 10, y - m1 - 15);
            ctx.fillText("120,0 N·m ↻", x + w - 100, y - m2 - 15);
        }
    }

    // Utilidades para dibujar flechas vectoriales
    function drawStraightArrow(x1, y1, x2, y2, color, text, txtX, txtY) {
        const headlen = 10;
        const angle = Math.atan2(y2 - y1, x2 - x1);
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        
        // Punta de flecha
        ctx.beginPath();
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
        ctx.fill();

        ctx.fillStyle = "#333";
        ctx.font = "bold 13px Segoe UI";
        ctx.fillText(text, txtX, txtY);
    }

    function drawCurvedArrow(x, y, r, startAngle, endAngle, ccw, color, text, txtX, txtY) {
        ctx.beginPath();
        ctx.arc(x, y, r, startAngle, endAngle, ccw);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();

        const headlen = 10;
        // La tangente para la punta de flecha depende del sentido (horario/antihorario)
        let angle = ccw ? endAngle - Math.PI/2 : endAngle + Math.PI/2;
        const arrowX = x + r * Math.cos(endAngle);
        const arrowY = y + r * Math.sin(endAngle);

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(arrowX, arrowY);
        ctx.lineTo(arrowX - headlen * Math.cos(angle - Math.PI / 6), arrowY - headlen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(arrowX - headlen * Math.cos(angle + Math.PI / 6), arrowY - headlen * Math.sin(angle + Math.PI / 6));
        ctx.fill();

        ctx.fillStyle = "#333";
        ctx.font = "bold 13px Segoe UI";
        ctx.fillText(text, txtX, txtY);
    }

    // Iniciar loop
    draw();
</script>

</body>
</html>
